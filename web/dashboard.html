<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BattleBot — training dashboard</title>
    <style>
      :root {
        --bg: #05070d;
        --panel: #0b1120;
        --stroke: rgba(120, 150, 200, 0.18);
        --text: #e9eefb;
        --muted: #7f8da8;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
        padding: 22px;
      }
      header {
        display: flex;
        align-items: baseline;
        gap: 14px;
        flex-wrap: wrap;
        margin-bottom: 18px;
      }
      h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
      .muted { color: var(--muted); font-size: 13px; letter-spacing: 0.06em; }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
        gap: 16px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--stroke);
        border-radius: 14px;
        padding: 14px 16px 8px;
      }
      .card h2 {
        margin: 0 0 2px;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
      .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; }
      canvas { width: 100%; height: 190px; display: block; }
      .stats { display: flex; gap: 26px; flex-wrap: wrap; margin: 4px 0 14px; }
      .stat b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; }
      .stat span { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
      a { color: #4dd2ff; }
      #empty { color: var(--muted); padding: 40px 0; text-align: center; }
    </style>
  </head>
  <body>
    <header>
      <h1>BattleBot training</h1>
      <span class="muted" id="rundir">no run</span>
      <span class="muted" style="margin-left: auto">
        <a href="/">← back to the arena</a>
      </span>
    </header>

    <div class="stats" id="stats"></div>
    <div id="empty">waiting for the first generation…</div>

    <div class="grid" id="grid" style="display: none">
      <div class="card">
        <h2>Fitness per generation</h2>
        <div class="legend">
          <span><i style="background:#3ddc97"></i>best</span>
          <span><i style="background:#4dd2ff"></i>median</span>
          <span><i style="background:#7f8da8"></i>worst</span>
        </div>
        <canvas id="c-fit"></canvas>
      </div>

      <div class="card">
        <h2>Rating (Elo)</h2>
        <div class="legend">
          <span><i style="background:#ffd166"></i>best</span>
          <span><i style="background:#ff8fa3"></i>mean</span>
        </div>
        <canvas id="c-elo"></canvas>
      </div>

      <div class="card">
        <h2>Combat quality</h2>
        <div class="legend">
          <span><i style="background:#8aff80"></i>accuracy</span>
          <span><i style="background:#ff4d6d"></i>wall-hugging</span>
        </div>
        <canvas id="c-skill"></canvas>
      </div>

      <div class="card">
        <h2>Generalization &amp; diversity</h2>
        <div class="legend">
          <span><i style="background:#c77dff"></i>win rate vs scripted</span>
          <span><i style="background:#00e5b0"></i>genome diversity</span>
        </div>
        <canvas id="c-gen"></canvas>
      </div>
    </div>

    <script type="module" src="/dashboard.js"></script>
  </body>
</html>
